<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
  <!-- Shared Woodland landscape with day, night, and overcast views. -->
  <defs>
    <filter id="galactic-soft" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="17"/></filter>
    <radialGradient id="moonGlow"><stop stop-color="#d5c3dd" stop-opacity=".19"/><stop offset="1" stop-color="#d5c3dd" stop-opacity="0"/></radialGradient>
    <radialGradient id="firelight"><stop stop-color="#e9d58c" stop-opacity=".65"/><stop offset=".25" stop-color="#dfce87" stop-opacity=".2"/><stop offset="1" stop-color="#d7c27c" stop-opacity="0"/></radialGradient>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#151924"/><stop offset=".4" stop-color="#484052"/><stop offset=".69" stop-color="#7e6578"/><stop offset="1" stop-color="#222832"/></linearGradient>
    <radialGradient id="dusk" cx="72%" cy="39%" r="49%"><stop stop-color="#cda69e" stop-opacity=".4"/><stop offset=".55" stop-color="#997489" stop-opacity=".12"/><stop offset="1" stop-color="#8c6b8d" stop-opacity="0"/></radialGradient>
    <linearGradient id="water" x2="0" y2="1"><stop stop-color="#7a788b"/><stop offset=".38" stop-color="#4a5a70"/><stop offset="1" stop-color="#283d53"/></linearGradient>
    <linearGradient id="mist" x2="0" y2="1"><stop stop-color="#bbb0c1" stop-opacity=".38"/><stop offset="1" stop-color="#9b8ca7" stop-opacity="0"/></linearGradient>
    <linearGradient id="day-sky" x2="0" y2="1"><stop stop-color="#3f667e"/><stop offset=".48" stop-color="#b1c8bd"/><stop offset="1" stop-color="#577a73"/></linearGradient>
    <radialGradient id="sun-haze" cx="36%" cy="9%" r="53%"><stop stop-color="#f9d994" stop-opacity=".56"/><stop offset="1" stop-color="#e9c993" stop-opacity="0"/></radialGradient>
    <linearGradient id="day-water" x2="0" y2="1"><stop stop-color="#aec8ba"/><stop offset=".45" stop-color="#65949b"/><stop offset="1" stop-color="#2b586c"/></linearGradient>
    <linearGradient id="day-mist" x2="0" y2="1"><stop stop-color="#d3ded2" stop-opacity=".42"/><stop offset="1" stop-color="#b3c9bb" stop-opacity="0"/></linearGradient>
    <linearGradient id="overcast-day-sky" x2="0" y2="1"><stop stop-color="#263945"/><stop offset=".46" stop-color="#839a9e"/><stop offset="1" stop-color="#577a73"/></linearGradient>
    <linearGradient id="overcast-night-sky" x2="0" y2="1"><stop stop-color="#141c29"/><stop offset=".49" stop-color="#4a5667"/><stop offset="1" stop-color="#222832"/></linearGradient>
    <linearGradient id="cloud-ceiling" x2="0" y2="1">
      <stop stop-color="#90a0ac" stop-opacity=".23"/>
      <stop offset=".38" stop-color="#899ca9" stop-opacity=".34"/>
      <stop offset=".76" stop-color="#879aa4" stop-opacity=".14"/>
      <stop offset="1" stop-color="#879aa4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflections" x2="0" y2="1"><stop stop-color="#293d50" stop-opacity=".5"/><stop offset="1" stop-color="#293d50" stop-opacity="0"/></linearGradient>
    <linearGradient id="alpine-rock" x2="0" y2="1"><stop stop-color="#607b88"/><stop offset="1" stop-color="#718f95"/></linearGradient>
    <linearGradient id="alpine-night" x2="0" y2="1"><stop stop-color="#535568"/><stop offset="1" stop-color="#404a5e"/></linearGradient>
