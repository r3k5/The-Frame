  <style>.fly{animation:glow 5s ease-in-out infinite alternate}.fly:nth-child(2n){animation-delay:-3.4s}.fly:nth-child(3n){animation-delay:-1.8s;animation-duration:6.5s}@keyframes glow{0%,20%{opacity:.18}70%,100%{opacity:.95}}@media(prefers-reduced-motion:reduce){.fly{animation:none;opacity:.65}}</style>
  <style>
    .sky-variant { display: none; }
    .sky-variant:target { display: inline; }
    .sky-variant:target ~ .night-sky, .sky-variant:target ~ .fireflies { display: none; }
    #night-backdrop:target ~ .night-sky .art-moon { display: none; }
    #night-backdrop:target ~ .fireflies { display: none; }
    .daylight:target ~ .woodland .far-peaks { fill: #929f9e; }
    .daylight:target ~ .woodland .mountains { fill: url(#alpine-rock); }
    .daylight:target ~ .woodland .rock-shadow { fill: #4f697a; }
    .daylight:target ~ .woodland .rock-light { fill: #91a9ac; }
    .daylight:target ~ .woodland .snowpack { fill: #e4ece3; }
    .daylight:target ~ .woodland .snow-shadow { fill: #a3b9bd; }
    .daylight:target ~ .woodland .ridge { fill: #4d6c62; }
    .daylight:target ~ .woodland .distant-firs { fill: #355a50; }
    .daylight:target ~ .woodland .mist { fill: url(#day-mist); }
    .daylight:target ~ .woodland .bank-left { fill: #375d52; }
    .daylight:target ~ .woodland .bank-right { fill: #3c6457; }
    .daylight:target ~ .woodland .water { fill: url(#day-water); }
    .daylight:target ~ .woodland .shore-left { fill: #244c43; }
    .daylight:target ~ .woodland .shore-right { fill: #2b5147; }
    .daylight:target ~ .woodland .firs { fill: #20473e; }
    .daylight:target ~ .woodland .near-firs { fill: #163932; }
    .daylight:target ~ .woodland .mid-firs { fill: #2d5749; }
    .daylight:target ~ .woodland .foreground-left { fill: #19382f; }
    .daylight:target ~ .woodland .foreground-right { fill: #1a3d34; }
  </style>
