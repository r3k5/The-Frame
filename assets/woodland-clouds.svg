<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2280 280">
  <!-- Scattered cloud textures for the partly cloudy scene. -->
  <defs>
    <linearGradient id="body" x2="0" y2="1">
      <stop class="cloud-top"/><stop class="cloud-middle" offset=".54"/>
      <stop class="cloud-base" offset="1" stop-opacity=".74"/>
    </linearGradient>
    <radialGradient id="light">
      <stop class="cloud-highlight" stop-opacity=".9"/>
      <stop class="cloud-highlight" offset=".5" stop-opacity=".53"/>
      <stop class="cloud-highlight" offset="1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow">
      <stop class="cloud-base" stop-opacity=".71"/>
      <stop class="cloud-base" offset="1" stop-opacity="0"/>
    </radialGradient>
    <filter id="feather" x="-.3" y="-.45" width="1.6" height="1.9" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".027 .041" numOctaves="3" seed="17" result="edge"/>
      <feDisplacementMap in="SourceGraphic" in2="edge" scale="19" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3.6"/>
    </filter>
    <g id="cumulus" filter="url(#feather)">
      <ellipse cx="166" cy="112" rx="152" ry="24" fill="url(#shadow)" opacity=".48"/>
      <path d="M18 108c-17-10-4-26 17-29 12-18 34-25 53-20 8-18 24-29 46-27 12-21 32-26 51-18 20 7 31 24 34 42 23-9 47 4 52 22 23-6 44 4 49 17 6 15-24 24-55 24-26 12-72 5-101 8-56 6-113 0-146-19Z" fill="url(#body)"/>
      <g fill="url(#light)">
        <ellipse cx="55" cy="86" rx="43" ry="22" opacity=".63"/>
        <ellipse cx="108" cy="69" rx="50" ry="33"/>
        <ellipse cx="168" cy="48" rx="57" ry="43"/>
        <ellipse cx="201" cy="60" rx="45" ry="36" opacity=".69"/>
        <ellipse cx="241" cy="84" rx="49" ry="27"/>
        <ellipse cx="282" cy="90" rx="34" ry="17" opacity=".53"/>
      </g>
      <ellipse cx="182" cy="105" rx="119" ry="28" fill="url(#shadow)" opacity=".63"/>
      <ellipse cx="123" cy="98" rx="89" ry="18" fill="url(#light)" opacity=".49"/>
    </g>
  </defs>
  <style>
    .cloud-top { stop-color: #f8f5ed; }
    .cloud-middle { stop-color: #d7e3e7; }
    .cloud-base { stop-color: #728b9e; }
    .cloud-highlight { stop-color: #fff4e0; }
    @media(prefers-color-scheme:dark) {
      .cloud-top { stop-color: #a6aac0; }
      .cloud-middle { stop-color: #737b9a; }
      .cloud-base { stop-color: #293449; }
      .cloud-highlight { stop-color: #d4c9df; }
    }
  </style>
  <g transform="translate(96 35) scale(1.24 1.08)">
    <use xlink:href="#cumulus"/>
    <use xlink:href="#cumulus" transform="translate(136 60) scale(.6 .65)" opacity=".72"/>
  </g>
  <use xlink:href="#cumulus" transform="translate(666 107) scale(.58 .49)" opacity=".78"/>
  <g transform="translate(1020 19) scale(1.38 1.13)">
    <use xlink:href="#cumulus" transform="translate(144 32) scale(.64 .82)" opacity=".81"/>
    <use xlink:href="#cumulus"/>
  </g>
  <use xlink:href="#cumulus" transform="translate(1676 111) scale(.75 .57)" opacity=".68"/>
  <use xlink:href="#cumulus" transform="translate(1950 48) scale(.83 .73)" opacity=".9"/>
</svg>
